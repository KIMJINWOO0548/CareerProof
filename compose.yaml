services:
  careerproof:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    volumes:
      - careerproof-history:/var/lib/careerproof
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  careerproof-history:
